name: Windows stable release

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-stable-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/stable'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: .\gradlew.bat clean test portableZip launcherZip --no-daemon
      - name: Check extracted packages
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem build/distributions/*-windows-x64.zip)
          $launchers = @(Get-ChildItem build/distributions/*-windows-x64-launcher.zip)
          if ($packages.Count -ne 1 -or $launchers.Count -ne 1) {
            throw 'Expected one portable ZIP and one Launcher ZIP.'
          }
          $diagnostics = Join-Path $env:GITHUB_WORKSPACE 'build/reports/package-check'
          New-Item -ItemType Directory -Force $diagnostics | Out-Null
          $env:JAVA_TOOL_OPTIONS += ' "-Danysound.dataDir=' + (Join-Path $diagnostics 'profile') + '"'
          # Java 21's jpackage EXE also converts its expanded JVM arguments to the
          # system ANSI code page. Keep the install path ASCII on English runners.
          $portableDir = Join-Path $env:RUNNER_TEMP 'AnySound portable'
          $launcherDir = Join-Path $env:RUNNER_TEMP 'AnySound launcher 中文'
          try {
            Expand-Archive $packages[0].FullName $portableDir
            Expand-Archive $launchers[0].FullName $launcherDir
            Copy-Item (Join-Path $portableDir 'AnySound/app/AnySound.cfg') (Join-Path $diagnostics 'portable-config.txt')
            $app = Start-Process (Join-Path $portableDir 'AnySound/AnySound.exe') -ArgumentList '--check' -PassThru `
              -RedirectStandardOutput (Join-Path $diagnostics 'portable-stdout.txt') `
              -RedirectStandardError (Join-Path $diagnostics 'portable-stderr.txt')
            $null = $app.Handle
            if (-not $app.WaitForExit(60000)) {
              Stop-Process -Id $app.Id -Force
              throw 'Portable preflight timed out after 60 seconds.'
            }
            $app.WaitForExit()
            if ($app.ExitCode -ne 0) { throw "Portable preflight failed: $($app.ExitCode); see package-check-logs." }
            # Keep Unicode coverage for the standalone Launcher: PowerShell sets
            # the working directory, while Java receives an ASCII JAR filename.
            Push-Location (Join-Path $launcherDir 'AnySound')
            try {
              & java -jar anysound-launcher.jar --check *> (Join-Path $diagnostics 'launcher-output.txt')
              if ($LASTEXITCODE -ne 0) { throw 'Launcher preflight failed; see package-check-logs.' }
            } finally {
              Pop-Location
            }
          } finally {
            Get-ChildItem $diagnostics -Filter '*.txt' -Recurse | ForEach-Object {
              Write-Host "::group::$($_.Name)"
              Get-Content $_.FullName -Encoding utf8
              Write-Host '::endgroup::'
            }
          }
          Get-ChildItem build/distributions/*.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content build/distributions/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: AnySound-windows-x64
          path: |
            build/distributions/*.zip
            build/distributions/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: stable-${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @'
          ## 下载选择

          - **Windows 便携包**（`*-windows-x64.zip`）：包含 Java 运行时，解压后打开 `AnySound/AnySound.exe`。
          - **Launcher 包**（`*-windows-x64-launcher.zip`）：需要已安装 Java 21 x64，请保留完整目录。

          两种包均需单独下载或导入本地识别模型。校验文件见 `SHA256SUMS.txt`。
          '@ | Set-Content $notes -Encoding utf8
          gh release view $env:RELEASE_TAG --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "AnySound Stable $env:GITHUB_RUN_NUMBER" --notes-file $notes --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
          }
          $assets = @(Get-ChildItem build/distributions/*.zip) + @(Get-Item build/distributions/SHA256SUMS.txt)
          gh release upload $env:RELEASE_TAG @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            anysound-launcher/build/reports/tests/test
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-check-logs
          path: build/reports/package-check
          if-no-files-found: ignore
